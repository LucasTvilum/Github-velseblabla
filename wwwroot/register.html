<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Opret bruger</title>
<style>
  body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f4; }
  form { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 260px; }
  h1 { font-size: 1.25rem; margin-top: 0; }
  input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; }
  button { width: 100%; padding: 0.5rem; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #555; }
  #message { margin-top: 1rem; font-size: 0.9rem; }
  a { display: block; margin-top: 1rem; text-align: center; font-size: 0.85rem; }
</style>
</head>
<body>
<form id="registerForm">
  <h1>Opret bruger</h1>
  <input type="text" id="username" placeholder="Brugernavn" required>
  <input type="password" id="password" placeholder="Password" required>
  <button type="submit">Opret</button>
  <div id="message"></div>
  <a href="/login.html">Har du allerede en bruger? Log ind</a>
</form>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const message = document.getElementById('message');
  message.textContent = '';

  const res = await fetch('/users/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });

  const text = await res.text();
  message.style.color = res.ok ? 'green' : 'crimson';
  message.textContent = res.ok ? 'Bruger oprettet! Du kan nu logge ind.' : text;
});
</script>
</body>
</html>
